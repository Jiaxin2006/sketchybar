name: Timer tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n sketchybarrc install.sh
      - run: for script in plugins/*.sh; do sh -n "$script"; done
